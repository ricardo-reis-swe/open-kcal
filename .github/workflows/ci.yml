name: CI

# ROAD-05: every push to main and every PR. The Release workflow reuses it as its gate (workflow_call).
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  # `github.workflow` is the caller's name under workflow_call, so a push never cancels a release's gate.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
