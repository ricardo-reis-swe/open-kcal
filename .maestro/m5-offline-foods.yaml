# ARCH-12 / ARCH-18 / ROAD-02 M5: a cached OFF food and a custom food stay searchable offline. The flow seeds its own
# local data through the dev-only `calorietracker://dev-seed` link (bootstrap/devSeedLink.ts), then goes offline after
# Metro has loaded; no provider request or live fixture is used. Android only: Maestro's airplane mode is Android-only.
appId: com.ricardoreis.calorietracker
tags:
  - android-only
onFlowComplete:
  - setAirplaneMode: disabled # always restore networking, also after a failed step
---
- runFlow: subflows/launch.yaml
- openLink: calorietracker://dev-seed
- tapOn:
    id: tab-add
- tapOn: Add food
- extendedWaitUntil:
    visible: Choose meal
    timeout: 5000
- tapOn: Lunch
- extendedWaitUntil:
    visible: Food search
    timeout: 5000
- setAirplaneMode: enabled
- tapOn:
    id: food-search-input
# Partial queries, so the full result name never matches the search field's own text.
- inputText: E2E Offline Oat
- extendedWaitUntil:
    visible: Offline. Showing saved foods only.
    timeout: 5000
- assertVisible: SAVED
- assertVisible: E2E Offline Oat Bar
- tapOn: E2E Offline Oat Bar
- extendedWaitUntil:
    visible: Add food
    timeout: 5000
- tapOn:
    id: food-detail-add
# NAV-04: an add returns to Food Search (with an Added toast); Back goes on to the Diary.
- extendedWaitUntil:
    visible:
      id: food-added-toast
    timeout: 5000
- tapOn: Back
# Meals can be reordered (M8), so the entry's meal may sit below the fold: scroll to it on the Diary.
- extendedWaitUntil:
    visible:
      id: calorie-ring
    timeout: 10000
- scrollUntilVisible:
    element: E2E Offline Oat Bar
    direction: DOWN
    timeout: 15000
- tapOn:
    text: 'Add food to .*'
    index: 1
- extendedWaitUntil:
    visible: Food search
    timeout: 5000
- tapOn:
    id: food-search-input
- inputText: Offline E2E custom
- extendedWaitUntil:
    visible: Offline. Showing saved foods only.
    timeout: 5000
- assertVisible: MY FOODS
- assertVisible: Offline E2E custom oats
- setAirplaneMode: disabled
