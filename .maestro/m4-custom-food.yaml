# ARCH-18 / ROAD-02 M4: create a custom food, add it with the ruler, edit/delete the entry, then delete the food.
appId: com.ricardoreis.calorietracker
---
- runFlow: subflows/launch.yaml
- evalScript: ${output.food = 'E2E oats ' + Date.now()}
- tapOn:
    id: tab-add
- tapOn: Add food
- extendedWaitUntil:
    visible: Choose meal
    timeout: 5000
- tapOn: Lunch
- extendedWaitUntil:
    visible: Food search
    timeout: 5000
- tapOn:
    id: food-search-input
- inputText: ${output.food}
# Fresh Android images can show a one-time Gboard handwriting tutorial here.
- tapOn:
    id: android:id/closeButton
    optional: true
# UX-04: fuzzy remote hits can fill the list, so use the always-present top action (same initialName). It sits
# above the keyboard; no hideKeyboard, which presses Back on Android when the keyboard is already down.
- tapOn:
    id: food-search-create-custom
- extendedWaitUntil:
    visible: New food
    timeout: 5000
# No hideKeyboard: Android presses Back when no soft keyboard shows, and the iOS number pad has no dismiss key (and
# Maestro drags don't trigger keyboardDismissMode). With the keypad up, iOS reports fields clipped behind the keypad
# as visible, so each field is centered first; the last one is scrolled fully into view (`scroll` starts at
# mid screen, inside the form) before its tap.
- tapOn:
    id: custom-food-serving
- inputText: '100'
- scrollUntilVisible:
    element:
      id: custom-food-energy
    direction: DOWN
    centerElement: true
- tapOn:
    id: custom-food-energy
- inputText: '200'
- scrollUntilVisible:
    element:
      id: custom-food-protein
    direction: DOWN
    centerElement: true
- tapOn:
    id: custom-food-protein
- inputText: '10'
- scrollUntilVisible:
    element:
      id: custom-food-carbohydrate
    direction: DOWN
    centerElement: true
- tapOn:
    id: custom-food-carbohydrate
- inputText: '20'
- scroll
- scroll
- tapOn:
    id: custom-food-fat
- inputText: '5'
# Dismiss the keypad before the header Save so the next screen opens without it: a tap on plain text in the form (the
# carbs helper) dismisses it (keyboardShouldPersistTaps="handled").
- tapOn: As on EU labels.*
- waitForAnimationToEnd
- tapOn:
    id: custom-food-save
- extendedWaitUntil:
    visible: Add food
    timeout: 5000
- tapOn:
    id: food-detail-add
- scrollUntilVisible:
    element: '${output.food}, 100 .*, 200 .*'
    direction: DOWN
    timeout: 15000
- tapOn: '${output.food}, 100 .*, 200 .*'
- extendedWaitUntil:
    visible: Edit entry
    timeout: 5000
- tapOn:
    id: serving-ruler-value
- tapOn:
    id: serving-value-input
- eraseText: 5
- inputText: '150'
- tapOn: Done
- scrollUntilVisible:
    element:
      id: food-entry-save
    direction: DOWN
- tapOn:
    id: food-entry-save
- scrollUntilVisible:
    element: '${output.food}, 150 .*, 300 .*'
    direction: DOWN
    timeout: 15000
- tapOn: '${output.food}, 150 .*, 300 .*'
- scrollUntilVisible:
    element:
      id: food-entry-delete
    direction: DOWN
- tapOn:
    id: food-entry-delete
- assertVisible: 'Delete food entry\?'
- tapOn:
    id: food-entry-delete-dialog-confirm
- extendedWaitUntil:
    notVisible: '${output.food}.*'
    timeout: 5000
# Clean up the custom food itself: a UX-04 swipe reveals Delete; tapping it deletes and offers Undo.
- tapOn:
    text: 'Add food to .*'
    index: 1
- tapOn:
    id: food-search-input
- inputText: ${output.food}
- extendedWaitUntil:
    visible:
      id: 'food-result-.*'
    timeout: 5000
- swipe:
    from:
      id: 'food-swipe-.*'
    direction: LEFT
- tapOn:
    id: 'food-swipe-.*-delete'
- extendedWaitUntil:
    visible:
      id: food-delete-undo
    timeout: 5000
# Remote sections list fuzzy matches (food-result-*), so check the deleted food's own row label (name, basis, energy).
- extendedWaitUntil:
    notVisible: '${output.food}, .*'
    timeout: 5000
