# ARCH-18 / ROAD-02 M5: custom and cached OFF results stay usable offline, with the provider offline status in place,
# and a cached food can be added with a changed serving count. Seeds its own local data through the dev-only
# `calorietracker://dev-seed` link (bootstrap/devSeedLink.ts). Android only: Maestro's airplane mode is Android-only.
appId: com.ricardoreis.calorietracker
tags:
  - android-only
onFlowComplete:
  - setAirplaneMode: disabled # always restore networking, also after a failed step
---
- runFlow: subflows/launch.yaml
- openLink: calorietracker://dev-seed
- tapOn:
    id: tab-add
- tapOn: Add food
- extendedWaitUntil:
    visible: Choose meal
    timeout: 5000
- tapOn: Lunch
- extendedWaitUntil:
    visible: Food search
    timeout: 5000
- setAirplaneMode: enabled
- tapOn:
    id: food-search-input
- inputText: Offline E2E
- extendedWaitUntil:
    visible: Offline. Showing saved foods only.
    timeout: 5000
- assertVisible: Offline E2E custom oats
- assertVisible: Offline E2E saved yoghurt
- tapOn: Offline E2E saved yoghurt
- extendedWaitUntil:
    visible: Add food
    timeout: 5000
- tapOn:
    id: serving-ruler-value
- tapOn:
    id: serving-value-input
- eraseText: 1
- inputText: '2'
# Submit from the keypad (same as Done): the dev LogBox toast for the offline provider failure can cover Done.
- pressKey: Enter
- tapOn:
    id: food-detail-add
# NAV-04: an add returns to Food Search (with an Added toast); Back goes on to the Diary.
- extendedWaitUntil:
    visible:
      id: food-added-toast
    timeout: 5000
- tapOn: Back
# Meals can be reordered (M8), so the entry's meal may sit below the fold: scroll to it on the Diary.
- extendedWaitUntil:
    visible:
      id: calorie-ring
    timeout: 10000
- scrollUntilVisible:
    element: 'Offline E2E saved yoghurt.*95.*'
    direction: DOWN
    timeout: 15000
- setAirplaneMode: disabled
