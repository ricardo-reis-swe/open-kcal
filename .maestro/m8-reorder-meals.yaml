# ARCH-18 / ROAD-02 M8: reorder meals (UX-17, NAV-06, DATA-10). Profile → Meals; a handle drag moves the first meal
# to the end and commits on drop (no Save). The order survives leaving and reopening Meals; a second drag restores it.
# Assumes the four default meals (index 3 is last); the first meal's name is read at run time, not hard-coded.
appId: com.ricardoreis.calorietracker
---
- runFlow: subflows/launch.yaml
- tapOn:
    id: tab-profile
- tapOn:
    id: profile-meals
- extendedWaitUntil:
    visible:
      id: meals-handle-3
    timeout: 5000
- copyTextFrom:
    id: meals-row-0
- evalScript: ${output.first = maestro.copiedText}
- swipe: # handle drag down past the last row; the drop index clamps to the end
    from:
      id: meals-handle-0
    direction: DOWN
    duration: 1500
- extendedWaitUntil:
    visible:
      id: meals-row-3
      text: ${output.first}
    timeout: 5000
- assertNotVisible:
    id: meals-row-0
    text: ${output.first}
# Committed on drop: the order is still there after leaving Meals.
- tapOn: Back
- tapOn:
    id: profile-meals
- extendedWaitUntil:
    visible:
      id: meals-row-3
      text: ${output.first}
    timeout: 5000
# Restore: drag the last meal back to the top.
- swipe:
    from:
      id: meals-handle-3
    direction: UP
    duration: 1500
- extendedWaitUntil:
    visible:
      id: meals-row-0
      text: ${output.first}
    timeout: 5000
- tapOn: Back
- assertVisible:
    id: profile-meals
