# ARCH-18 / ROAD-02 M3: Add Quick Calories (SCOPE-11 flow 2), then edit and delete it from the Diary.
# + → Quick calories → Meal Picker → Lunch → kcal + note → Add ends on the Diary (NAV-03, UX-07, UX-10).
# The row opens Edit quick calories; Save returns to the Diary; Delete asks first (NAV-04, NAV-08, UX-19).
# A unique note per run keeps an entry left by an interrupted run from matching; the entry is deleted at the end.
appId: com.ricardoreis.calorietracker
---
- runFlow: subflows/launch.yaml
- evalScript: ${output.note = 'E2E ' + Date.now()}
- tapOn:
    id: tab-add
- tapOn: Quick calories
- extendedWaitUntil:
    visible: Choose meal
    timeout: 5000
- tapOn: Lunch
- extendedWaitUntil:
    visible:
      id: quick-calories-kcal
    timeout: 5000
- inputText: '450'
- tapOn:
    id: quick-calories-note
- inputText: ${output.note}
- tapOn:
    id: quick-calories-submit
- extendedWaitUntil:
    visible: '${output.note}, Quick Calories, 450 .*'
    timeout: 5000
# Edit: change the amount and save.
- tapOn: '${output.note}, Quick Calories, 450 .*'
- extendedWaitUntil:
    visible: Edit quick calories
    timeout: 5000
- eraseText: 6
- inputText: '500'
- tapOn:
    id: quick-calories-submit
- extendedWaitUntil:
    visible: '${output.note}, Quick Calories, 500 .*'
    timeout: 5000
# Delete: confirm in the dialog.
- tapOn: '${output.note}, Quick Calories, 500 .*'
- extendedWaitUntil:
    visible:
      id: quick-calories-delete
    timeout: 5000
# The keyboard opens with the screen; a scroll dismisses it and shows Delete entry at the end of the content.
- scroll
- tapOn:
    id: quick-calories-delete
- assertVisible: 'Delete quick calories\?'
- tapOn:
    id: quick-calories-delete-dialog-confirm
- extendedWaitUntil:
    notVisible: '${output.note}.*'
    timeout: 5000
- assertVisible:
    id: calorie-ring
