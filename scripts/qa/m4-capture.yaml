# ROAD-02 / DS-13 M4 Android visual QA. SHOT is supplied by m4.sh.
appId: com.ricardoreis.calorietracker
---
- runFlow: ../../.maestro/subflows/launch.yaml
- evalScript: ${output.food = 'QA oats ' + Date.now()}
- tapOn:
    id: tab-add
- tapOn: Add food
- tapOn: Lunch
- extendedWaitUntil:
    visible: Food search
    timeout: 5000
- takeScreenshot: ${SHOT}-food-search
- tapOn:
    id: food-search-input
- inputText: ${output.food}
- hideKeyboard
- tapOn:
    id: food-create-custom
- extendedWaitUntil:
    visible: New food
    timeout: 5000
- takeScreenshot: ${SHOT}-new-food
- tapOn:
    id: custom-food-serving
- inputText: '100'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: custom-food-energy
    direction: DOWN
- tapOn:
    id: custom-food-energy
- inputText: '200'
- hideKeyboard
- tapOn:
    id: custom-food-protein
- inputText: '10'
- hideKeyboard
- tapOn:
    id: custom-food-carbohydrate
- inputText: '20'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: custom-food-fat
    direction: DOWN
- tapOn:
    id: custom-food-fat
- inputText: '5'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: custom-food-save
    direction: DOWN
- tapOn:
    id: custom-food-save
- extendedWaitUntil:
    visible: Add food
    timeout: 5000
- takeScreenshot: ${SHOT}-add-entry
- tapOn:
    id: food-detail-add
- scrollUntilVisible:
    element: '${output.food}, 100 .*, 200 .*'
    direction: DOWN
    timeout: 15000
- tapOn: '${output.food}, 100 .*, 200 .*'
- extendedWaitUntil:
    visible: Edit entry
    timeout: 5000
- takeScreenshot: ${SHOT}-edit-entry
- scrollUntilVisible:
    element:
      id: food-entry-delete
    direction: DOWN
- tapOn:
    id: food-entry-delete
- takeScreenshot: ${SHOT}-delete-dialog
- tapOn:
    id: food-entry-delete-dialog-confirm
